<html>
<head>
    <title>FORM CREATION</title>
</head>
<body>

<h2>REGISTRATION FORM</h2>

<form onsubmit="return alert_msg()">

Name: <input type="text" id="name"><br><br>
Gender:
<input type="radio" id="gender" value="Male">Male
<input type="radio" id="gender" value="Female">Female
<br><br>
Email: <input type="text" id="email"><br><br>
MobileNumber:<input type="text" id="mobile_number"><br><br>
Password: <input type="password" id="password"><br><br>
<input type="submit" value="Register">

</form>

<p id="demo">welcome</p>
<button onclick="changetext()">Change Text</button>
<script>

function alert_msg() {
if (document.getElementById("name").value== "") {
alert("Enter your name");
return false;
}

let em=document.getElementById("email").value
let emailpattern=/^[^ ]+@[^ ]+\.+[a-z]{2,3}$/;
if (em == "" || !em.match(emailpattern)) {
    alert("Enter valid email");
    return false;
}

let mobile = document.getElementById("mobile_number").value
let mobilepattern=/^(?:\+91|91|0)?[6-9]\d{9}$/
if (mobile=="" || !mobile.match(mobilepattern)){
alert("Enter valid mobile number");
return false;
}

let pass=document.getElementById("password").value 
if (pass == "" || pass.length!=6){
alert("Enter more than 6 characters for password");
return false;
}

alert("You have entered all the details");
}

function change Text(){
document.getElementById("demo").style.color="red";
document.getElementById("demo").style.fontsize="30px";
document.getElementById("demo").innerHTML="welcome to ctug";
}

</script>
</body>
</html>
